<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Grocery Store{% endblock %}</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f4f6f8; }
    .container { max-width: 960px; margin: 20px auto; padding: 20px; background: #fff; border-radius: 8px; box-shadow: 0 0 16px rgba(0,0,0,0.05); }
    .top a { color: #1a73e8; text-decoration: none; margin-right: 12px; }
    .top a:hover { text-decoration: underline; }
    .flash { padding: 12px 16px; border-radius: 6px; margin-bottom: 16px; }
    .flash-success { background: #e6f7eb; color: #1a702b; }
    .flash-danger { background: #fdecea; color: #8a1f11; }
    .flash-warning { background: #fff4e5; color: #8a5a00; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { padding: 10px; border: 1px solid #e0e0e0; text-align: left; }
    th { background: #f7f9fb; }
    input, select, button { padding: 8px 10px; margin: 4px 0; border: 1px solid #c4c4c4; border-radius: 4px; }
    button, .button { background: #1a73e8; color: #fff; border: none; cursor: pointer; border-radius: 4px; text-decoration: none; display: inline-block; }
    button:hover, .button:hover { opacity: 0.92; }
    .form-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .form-row label { display: flex; flex-direction: column; font-size: 0.95rem; }
    .small-text { color: #555; font-size: 0.95rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="top">
      <h1>{% block title %}Grocery Store{% endblock %}</h1>
      <p>
        <a href="{{ url_for('index') }}">Trang chủ</a>
        <a href="{{ url_for('goods.list_goods') }}">Hàng hóa</a>
        <a href="{{ url_for('customers.list_customers') }}">Khách hàng</a>
        <a href="{{ url_for('invoices.list_invoices') }}">Hóa đơn</a>
      </p>
    </div>

    {% for category, message in get_flashed_messages(with_categories=true) %}
      <div class="flash flash-{{ category }}">{{ message }}</div>
    {% endfor %}

    {% block content %}{% endblock %}
  </div>
</body>
</html>
