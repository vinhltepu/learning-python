{% extends "base.html" %}
{% block content %}

<h2>Invoices</h2>

<form method="get">
  <label>Customer:</label>
  <select name="customer_id">
    <option value="">(All)</option>
    {% for c in customers %}
      <option value="{{c.id}}" {% if customer_id==c.id %}selected{% endif %}>
        {{c.name}} - {{c.phone}}
      </option>
    {% endfor %}
  </select>

  <label>From:</label>
  <input type="date" name="date_from" value="{{ date_from or '' }}">
  <label>To:</label>
  <input type="date" name="date_to" value="{{ date_to or '' }}">

  <button type="submit">Lọc</button>
  <a href="/invoices/new">+ Tạo hóa đơn</a>
</form>

<table border="1" cellpadding="6" cellspacing="0">
  <tr>
    <th>ID</th><th>Created</th><th>Customer</th><th>Subtotal</th><th>Discount</th><th>Total</th><th>Action</th>
  </tr>
  {% for i in invoices %}
  <tr>
    <td>{{i.id}}</td>
    <td>{{i.created_at}}</td>
    <td>{{i.customer.name}}</td>
    <td>{{i.subtotal}}</td>
    <td>{{i.discount_amount}}</td>
    <td>{{i.total}}</td>
    <td><a href="/invoices/{{i.id}}">Chi tiết</a></td>
  </tr>
  {% endfor %}
</table>

{% endblock %}
