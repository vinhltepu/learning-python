<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Products</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='/css/style.css') }}">
</head>
<body>
  <h2>Danh sách sản phẩm</h2>
  <a href="/products/add">+ Thêm sản phẩm</a>

  <table>
    <tr><th>ID</th><th>Name</th><th>Code</th><th>Price</th><th>Stock</th></tr>
    {% for p in items %}
    <tr>
      <td>{{ p[0] }}</td><td>{{ p[1] }}</td><td>{{ p[2] }}</td><td>{{ p[3] }}</td><td>{{ p[4] }}</td>
    </tr>
    {% endfor %}
  </table>
</body>
</html>
