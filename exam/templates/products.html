<table border="1" cellpadding="6" cellspacing="0">
  <tr>
    <th>ID</th><th>Name</th><th>Code</th><th>Unit</th>
    <th>Import</th><th>Sell</th><th>Stock</th><th>Date</th><th>Action</th>
  </tr>

  {% for p in items %}
  <tr>
    <td>{{ p[0] }}</td>
    <td>{{ p[1] }}</td>
    <td>{{ p[2] }}</td>
    <td>{{ p[3] }}</td>
    <td>{{ p[4] }}</td>
    <td>{{ p[5] }}</td>
    <td>{{ p[6] }}</td>
    <td>{{ p[7] }}</td>
    <td>
      <a href="/products/{{ p[0] }}/edit">Sửa</a>
      <form action="/products/{{ p[0] }}/delete" method="post" style="display:inline;">
        <button type="submit">Xóa</button>
      </form>
    </td>
  </tr>
  {% endfor %}
</table>
