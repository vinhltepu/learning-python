{% extends "base.html" %}
{% block content %}

<h2>{% if mode == 'add' %}Thêm sản phẩm{% else %}Sửa sản phẩm{% endif %}</h2>

<form method="post">
  <div><label>Tên</label>
    <input name="name" value="{{ form.get('name', product.name if product else '') }}">
  </div>
  <div><label>Mã</label>
    <input name="code" value="{{ form.get('code', product.code if product else '') }}">
  </div>
  <div><label>Đơn vị</label>
    <input name="unit" value="{{ form.get('unit', product.unit if product else '') }}">
  </div>
  <div><label>Giá nhập</label>
    <input name="import_price" value="{{ form.get('import_price', product.import_price if product else 0) }}">
  </div>
  <div><label>Giá bán</label>
    <input name="sell_price" value="{{ form.get('sell_price', product.sell_price if product else 0) }}">
  </div>
  <div><label>Tồn kho</label>
    <input name="stock" value="{{ form.get('stock', product.stock if product else 0) }}">
  </div>
  <div><label>Ngày nhập</label>
    <input type="date" name="imported_date" value="{{ form.get('imported_date', product.imported_date if product else '') }}">
  </div>

  <div><label>Loại</label>
    {% set cur_type = form.get('product_type', product.product_type if product else 'base') %}
    <select name="product_type">
      <option value="base" {% if cur_type=='base' %}selected{% endif %}>Base</option>
      <option value="painting" {% if cur_type=='painting' %}selected{% endif %}>Painting</option>
      <option value="wood" {% if cur_type=='wood' %}selected{% endif %}>Wood</option>
    </select>
  </div>

  <div><label>Hãng sơn (painting)</label>
    <input name="paint_brand" value="{{ form.get('paint_brand', product.paint_brand if product else '') }}">
  </div>

  <div><label>Nguồn gỗ (wood)</label>
    <input name="wood_source" value="{{ form.get('wood_source', product.wood_source if product else '') }}">
  </div>

  <button type="submit">Lưu</button>
</form>

{% endblock %}
