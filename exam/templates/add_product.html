<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Add Product</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <h2>Thêm sản phẩm</h2>

  <form method="post">
    <p>Name: <input name="name" required></p>
    <p>Code: <input name="code" required></p>
    <p>Price: <input name="price" value="0"></p>
    <p>Stock: <input name="stock" value="0"></p>
    <button type="submit">Lưu</button>
  </form>

  <p><a href="/products">← Quay lại</a></p>
</body>
</html>
