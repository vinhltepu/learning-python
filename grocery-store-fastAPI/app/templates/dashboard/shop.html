{% extends "base.html" %}

{% block content %}

<h2>DANH SÁCH SẢN PHẨM</h2>

<table border="1" cellpadding="8">

<tr>
    <th>Tên sản phẩm</th>
    <th>Giá bán</th>
    <th>Tồn kho</th>
    <th></th>
</tr>

{% for product in products %}

<tr>

    <td>{{ product.name }}</td>

    <td>{{ product.sale_price }}</td>

    <td>{{ product.stock }}</td>

    <td>

        <a href="#">
            Thêm vào giỏ
        </a>

    </td>

</tr>

{% endfor %}

</table>

{% endblock %}
