{% extends "base.html" %}

{% block content %}

<h2>Thêm sản phẩm</h2>

<form method="post">

<p>
Tên sản phẩm<br>
<input type="text" name="name" required>
</p>

<p>
Mã sản phẩm<br>
<input type="text" name="code" required>
</p>

<p>
Đơn vị<br>
<input type="text" name="unit" required>
</p>

<p>
Giá nhập<br>
<input type="number" step="0.01" name="import_price" required>
</p>

<p>
Giá bán<br>
<input type="number" step="0.01" name="selling_price" required>
</p>

<p>
Tồn kho<br>
<input type="number" name="stock" required>
</p>

<button type="submit">Lưu</button>

<a href="/products-page">
Hủy
</a>

</form>

{% endblock %}
